<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Louis Berenyi</title>
<meta name="description" content="Selected projects by Louis Berenyi: machine-learning optimization, systems tooling, open-source contributions, and full-stack work.">
<script>try{var t=localStorage.getItem('lb-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="canonical" href="https://luidevo.github.io/portfolio/project.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Louis Berenyi">
<meta property="og:title" content="Projects — Louis Berenyi">
<meta property="og:description" content="Machine-learning optimization, systems tooling, open-source contributions, and full-stack work.">
<meta property="og:url" content="https://luidevo.github.io/portfolio/project.html">
<meta property="og:image" content="https://luidevo.github.io/portfolio/images/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div id="top" class="shell shell--narrow">

  <header class="hdr">
    <a href="index.html" class="backlink flink"><span class="glyph">←</span> Index</a>
    <button id="themeBtn" class="btn btn--icon" title="Toggle theme"><span id="themeGlyph">☾</span></button>
  </header>

  <main class="main main--fade">

    <div class="eyebrow">
      <span id="p-num"></span>
      <span class="sep"></span>
      <span id="p-kind" class="kind"></span>
    </div>

    <h1 id="p-title" class="h1-page h1-page--gap"></h1>
    <p id="p-sub" class="lede"></p>

    <div id="p-stack" class="chips chips--stack"></div>
    <div id="p-links" class="link-row"></div>

    <div id="p-media" class="media">
      <span id="p-caption" class="media-cap"></span>
    </div>

    <div class="detail-grid detail-grid--top reveal">
      <div class="detail-label">Overview</div>
      <div id="p-overview"></div>
    </div>

    <div class="detail-grid detail-grid--rule reveal">
      <div class="detail-label">Highlights</div>
      <div id="p-highlights"></div>
    </div>

    <div class="detail-grid">
      <div class="detail-label">Details</div>
      <div class="detail-cols">
        <div>
          <div class="detail-col-label">Year</div>
          <div id="p-year" class="detail-value"></div>
        </div>
        <div>
          <div class="detail-col-label">Role</div>
          <div id="p-role" class="detail-value"></div>
        </div>
      </div>
    </div>

    <a id="p-next" href="#" class="next reveal">
      <div>
        <div class="next-label">Next</div>
        <div id="p-next-title" class="next-title"></div>
      </div>
      <span class="arrow arrow--lg">↗</span>
    </a>

  </main>

  <footer class="ftr">
    <a href="index.html" class="ftr-link">← Back to index</a>
    <span>© 2026 Louis Berenyi</span>
  </footer>

</div>

<script>
(function () {
  var root = document.documentElement;
  var themeBtn = document.getElementById('themeBtn');
  var themeGlyph = document.getElementById('themeGlyph');

  function stored() { try { return localStorage.getItem('lb-theme'); } catch (e) { return null; } }
  function applyTheme(t) { try { root.setAttribute('data-theme', t); } catch (e) {} }
  var theme = stored() || 'light';
  applyTheme(theme);
  themeGlyph.textContent = theme === 'dark' ? '☀' : '☾';
  themeBtn.addEventListener('click', function () {
    theme = theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('lb-theme', theme); } catch (e) {}
    applyTheme(theme);
    themeGlyph.textContent = theme === 'dark' ? '☀' : '☾';
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') window.location.href = 'index.html';
  });

  // --- project data ---
  var data = {
    'parameter-golf': {
      num: '01', kind: 'ML / Optimization', title: 'Parameter Golf',
      sub: 'Quantizing a language model into a hard 16 MB memory budget under a time limit.',
      year: '2026', role: 'Partner',
      stack: ['Python', 'PyTorch', 'NumPy', 'QAT', 'int6', 'RunPod', 'SSH'],
      links: [{ label: 'GitHub ↗', href: 'https://github.com/LUIDevo/parameter-golf' }],
      mate: { name: 'Albless', href: 'https://allblesslema.github.io/Personal-Site/' },
      caption: 'training-run dashboard',
      image: { webp: 'images/parameter-golf.webp', fallback: 'images/parameter-golf.jpg' },
      imagePos: 'top',
      overview: [
        'Parameter Golf was a machine-learning optimization challenge: take a base GPT transformer and minimize its score as much as possible while fitting the whole model inside a hard 16 MB budget.',
        'Albless and I approached it with quantization-aware training (QAT), pushing weight quantization from int8 down to int6 via bitwise shifts and grouping, then tuning model parameters to stabilize the loss from the heavier quantization.'
      ],
      highlights: [
        'Applied quantization-aware training (QAT) with int8 → int6 weights — 25% fewer bits per weight inside a 16 MB budget.',
        'Added stochastic weight averaging (SWA) and weighted EMA for training stability.',
        'Ran experiments on rented cloud GPUs (RunPod over SSH) with a custom logging system to track and compare runs across the train/eval loop.'
      ]
    },
    'rmux': {
      num: '02', kind: 'Open Source · Rust', title: 'rmux',
      sub: 'A tmux-plugin integration and a pane-indexing fix for a 2.2k-star terminal multiplexer.',
      year: '2026', role: 'Contributor',
      stack: ['Rust', 'Systems', 'Open Source'],
      links: [{ label: 'GitHub ↗', href: 'https://github.com/LUIDevo' }, { label: 'Merged PR', href: 'https://github.com/Helvesec/rmux/pull/24#issuecomment-4729173377' }],
      caption: 'terminal panes',
      image: { webp: 'images/rmux.webp', fallback: 'images/rmux.jpg' },
      imagePos: 'top',
      overview: [
        'rmux is a Rust-based terminal multiplexer with around 2.5k GitHub stars.',
        'I built a compatibility layer that lets rmux run tmux plugins like tmux-sensible. Because .tmux files are just bash scripts that call the "tmux" command, I added a shim that intercepts those calls via a PATH override and translates them into rmux commands.',
        'I weighed simpler approaches such as rewriting every "tmux" in the script to "rmux" — but the shim was cleaner and less prone to breakage. With this translation layer, rmux can now run .tmux files natively.',
        'I also fixed a configuration bug where panes stayed 0-indexed regardless of the user\'s config. The root cause spanned three subsystems, so the fix had to be consistent everywhere a pane index is surfaced.'
      ],
      highlights: [
        'Built a tmux-plugin compatibility shim so existing plugins (e.g. tmux-sensible) run unmodified inside rmux.',
        'Traced a silent pane-base-index bug across three subsystems: display-panes, list-panes, and #P status-line formatting.',
        'Implemented a shared helper applying the configured offset consistently across every affected path.',
        'Added regression tests covering pane labels and ListPanes output.'
      ]
    },
    'robotics-platform': {
      num: '03', kind: 'Full-Stack · AI', title: 'Robotics Scouting & Strategy Platform',
      sub: 'Turning raw scouting data into AI-generated match strategy for a 30–40 person team.',
      year: '2025', role: 'Lead Developer',
      stack: ['React', 'GraphQL', 'Apollo', 'Prisma', 'SQLite', 'Gemini API'],
      links: [{ label: 'GitHub ↗', href: 'https://github.com/LUIDevo' }],
      caption: 'strategy dashboard',
      image: { webp: 'images/frc-graphql-app.webp', fallback: 'images/frc-graphql-app.jpg' },
      imagePos: 'top',
      overview: [
        'A full-stack analytics platform (React + GraphQL/Apollo + Prisma) that turns raw scouting data into AI-generated match strategy, replacing manual spreadsheet workflows for a 30–40 person robotics team.',
        'I backed it with an offline-first local database that mirrors stats from a third-party competition API, so analysis keeps working at venues with flaky networks.'
      ],
      highlights: [
        'Built an LLM strategy engine that assembles structured prompts from team stats and game rules, calling the Gemini API for styled HTML breakdowns of any two alliances.',
        'Added nearest-neighbor opponent lookup over 7-dimensional vector embeddings.',
        'Layered in NLP sentiment scoring of scout notes to surface qualitative signal alongside the numbers.'
      ]
    },
    'match-logging': {
      num: '04', kind: 'Offline-First', title: 'Offline-First Match-Logging App',
      sub: 'A zero-dependency client that captured 1,300+ match logs live, with no network.',
      year: '2025', role: 'Lead Developer',
      stack: ['Vanilla JS', 'HTML/CSS', 'TypeScript', 'Node.js'],
      links: [{ label: 'GitHub ↗', href: 'https://github.com/LUIDevo' }],
      caption: 'logging interface',
      image: { webp: 'images/offline-logging-app.webp', fallback: 'images/offline-logging-app.jpg' },
      imagePos: 'top',
      overview: [
        'A framework-free client built in vanilla HTML/CSS/JS, with no build step and no runtime dependencies — so it runs in any browser on any device and works fully offline. Offline support was a hard requirement, since some competition venues had no network.',
        'I paired it with a TypeScript/Node service that synced reports to a secured central database once a connection returned.'
      ],
      highlights: [
        'Captured 1,300+ match logs in live competition across a team of 30–40 people.',
        'Shipped with zero runtime dependencies.',
        'Queued and synced submissions to the Node service automatically once a connection came back.'
      ]
    },
    'yapchain': {
      num: '05', kind: 'Web3 · Hackathon', title: 'Yapchain',
      sub: 'A decentralized, proximity-based social app where users own their data.',
      image: { webp: 'images/yapchain.webp', fallback: 'images/yapchain.jpg' },
      imagePos: 'top',
      year: '2024', role: 'Team',
      stack: ['React', 'Next.js', 'Node', 'Express', 'NEAR', 'Blockchain'],
      links: [{ label: 'DoraHacks ↗', href: 'https://dorahacks.io/buidl/13388' }],
      caption: 'canvas chat rooms',
      overview: [
        'Yapchain is a decentralized, proximity-based social app built on the NEAR blockchain, where users own their own data. It won Best Use of NEAR Protocol at JamHacks 2024.',
        'Chat rooms are navigable and rendered on an HTML canvas, with an on-ledger feed of anonymous posts secured through the blockchain.'
      ],
      highlights: [
        'JamHacks 2024 Winner — Best Use of NEAR Protocol.',
        'Rendered navigable, proximity-based chat rooms on HTML canvas.',
        'Built an on-ledger feed of anonymous posts with user-owned data.'
      ]
    },
    'spud': {
      num: '06', kind: 'CLI · Rust', title: 'spud',
      sub: 'A Rust CLI that downloads and organizes music from YouTube, with Spotify integration.',
      year: '2026', role: 'Solo',
      stack: ['Rust', 'Spotify API', 'OAuth'],
      links: [{ label: 'GitHub ↗', href: 'https://github.com/LUIDevo/spud' }],
      caption: 'CLI output',
      image: 'images/spud.gif',
      imagePos: 'left top',
      imageHug: true,
      overview: [
        'spud is a Rust command-line tool that downloads and organizes music from YouTube playlists, with Spotify API integration via an OAuth flow.',
        'I built it as a simpler, more stable alternative to SpotDL, which had grown error-prone by 2026 due to Spotify API changes.'
      ],
      highlights: [
        'Built as a leaner, more reliable alternative to SpotDL.',
        'Downloads and organizes music straight from YouTube playlists.',
        'Integrates the Spotify API through a full OAuth flow.'
      ]
    }
  };

  var order = ['parameter-golf', 'rmux', 'robotics-platform', 'match-logging', 'yapchain', 'spud'];

  function slug() {
    try { return new URLSearchParams(window.location.search).get('p') || 'parameter-golf'; }
    catch (e) { return 'parameter-golf'; }
  }

  var s = data[slug()] ? slug() : 'parameter-golf';
  var p = data[s];
  var nextSlug = order[(order.indexOf(s) + 1) % order.length];
  var np = data[nextSlug];

  function set(id, txt) { document.getElementById(id).textContent = txt; }
  set('p-num', p.num);
  set('p-kind', p.kind);
  set('p-title', p.title);
  set('p-sub', p.sub);
  set('p-caption', p.caption);
  set('p-year', p.year);
  set('p-role', p.role);
  document.title = p.title + ' — Louis Berenyi';

  if (p.image) {
    var media = document.getElementById('p-media');
    media.innerHTML = '';
    media.classList.add('media--filled');
    if (p.imageHug) media.classList.add('media--hug');
    var webp = (typeof p.image === 'object') ? p.image.webp : null;
    var fallback = (typeof p.image === 'object') ? p.image.fallback : p.image;
    var holder = media;
    if (webp) {
      var pic = document.createElement('picture');
      var src = document.createElement('source');
      src.type = 'image/webp';
      src.srcset = webp;
      pic.appendChild(src);
      media.appendChild(pic);
      holder = pic;
    }
    var img = document.createElement('img');
    img.src = fallback;
    img.alt = p.title;
    img.loading = 'lazy';
    img.decoding = 'async';
    if (!p.imageHug) img.style.objectPosition = p.imagePos || 'center';
    holder.appendChild(img);
  }

  var stackEl = document.getElementById('p-stack');
  p.stack.forEach(function (tag, i) {
    var el = document.createElement('span');
    el.className = 'chip chip--stack stagger';
    el.style.animationDelay = (i * 60) + 'ms';
    el.textContent = tag;
    stackEl.appendChild(el);
  });

  var linksEl = document.getElementById('p-links');
  p.links.forEach(function (lnk) {
    var a = document.createElement('a');
    a.href = lnk.href; a.target = '_blank'; a.rel = 'noopener'; a.className = 'ul';
    a.textContent = lnk.label;
    linksEl.appendChild(a);
  });

  function fillText(parent, text) {
    // inline-link the groupmate's name if p.mate is set
    var name = p.mate && p.mate.name, idx = name ? text.indexOf(name) : -1;
    if (idx === -1) { parent.textContent = text; return; }
    parent.appendChild(document.createTextNode(text.slice(0, idx)));
    var a = document.createElement('a');
    a.href = p.mate.href; a.target = '_blank'; a.rel = 'noopener'; a.className = 'ul';
    a.textContent = name;
    parent.appendChild(a);
    parent.appendChild(document.createTextNode(text.slice(idx + name.length)));
  }

  var ovEl = document.getElementById('p-overview');
  p.overview.forEach(function (para) {
    var el = document.createElement('p');
    el.className = 'ov-para';
    fillText(el, para);
    ovEl.appendChild(el);
  });

  var hlEl = document.getElementById('p-highlights');
  p.highlights.forEach(function (h, i) {
    var row = document.createElement('div');
    row.className = 'hl-row stagger';
    row.style.animationDelay = (120 + i * 90) + 'ms';
    var arrow = document.createElement('span');
    arrow.className = 'hl-arrow';
    arrow.textContent = '→';
    var txt = document.createElement('span');
    txt.className = 'hl-text';
    txt.textContent = h;
    row.appendChild(arrow); row.appendChild(txt);
    hlEl.appendChild(row);
  });

  set('p-next-title', np.title);
  document.getElementById('p-next').href = 'project.html?p=' + nextSlug;

  // --- scroll reveal ---
  var reveals = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    reveals.forEach(function (el) { io.observe(el); });
  } else {
    reveals.forEach(function (el) { el.classList.add('in'); });
  }
})();
</script>
</body>
</html>
